# Alembic configuration for the Sales Agent backend.
#
# The database URL is intentionally NOT stored here — it is resolved from the
# application settings (DATABASE_URL env var) inside ``migrations/env.py`` so
# configuration stays single-sourced.

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
version_path_separator = os

# Unusual symbol characters are escaped; this file carries no secrets.
# (The line below is deliberately left empty — see env.py for URL resolution.)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
